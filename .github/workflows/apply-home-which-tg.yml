name: apply-home-which-tg
on:
  pull_request:
    branches: [main]
jobs:
  apply:
    if: github.head_ref == 'cursor/home-which-tg-d9aa'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply home which/telegram doors
        run: |
          set -euo pipefail
          if grep -Fq 'const HOME_WHICH_DOOR' dasha-lobby-worker.mjs; then
            echo "patch already in worker"
            exit 0
          fi
          git apply patches/home-which-tg.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dasha-lobby-worker.mjs
          git commit -m "Mount /which and Telegram doors on home first paint"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
