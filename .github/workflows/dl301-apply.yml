name: dl301-apply
on:
  push:
    branches: [instinct/dl301-guest-rate-durable]
    paths: ['.github/workflows/dl301-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instinct/dl301-guest-rate-durable
          fetch-depth: 2
      - name: Apply DL301 patch and remove this workflow
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/dl301.patch
          echo "$(sha256sum /tmp/dl301.patch)"
          git apply --index /tmp/dl301.patch
          git rm -q .github/workflows/dl301-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Compute: durable guest-key mint and chat limits (#301)" -m "Guest mint (per IP, per pairing code) and guest chat window counters move from the in-memory rates Map to DO storage under compute:guest-rate:<sha256(salt|name)>. Check + key creation run under one per-storage lock, so concurrent mints cannot exceed the max. Rows keep only in-window hit times plus expiresAt and are pruned at most every 10 min. Other takeRate callers unchanged. Claim RC-2026-09-23-DL301."
          git push origin "HEAD:instinct/dl301-guest-rate-durable"
