name: dl299-apply
on:
  push:
    branches: [instinct/dl299-factory-forge]
    paths: ['.github/workflows/dl299-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instinct/dl299-factory-forge
          fetch-depth: 2
      - name: Apply DL299 patch and remove this workflow
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/dl299.patch
          echo "$(sha256sum /tmp/dl299.patch)"
          git apply --index /tmp/dl299.patch
          git rm -q .github/workflows/dl299-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Compute: close forged hosted settle on /compute/api/factory (#299)" -m "Public router serves GET/HEAD only on /compute/api/factory; the hosted bump moves to an internal-only DO path; settlement derives from the server-side charged record (compute:credit-spend) and rejects missing, refunded, replayed or mismatched assertions before any write. Regression: dasha-compute-factory-forge.test.mjs. Claim RC-2026-09-23-DL299."
          git push origin "HEAD:instinct/dl299-factory-forge"
