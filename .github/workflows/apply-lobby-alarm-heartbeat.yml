name: apply-lobby-alarm-heartbeat
on:
  pull_request:
    branches: [main]
jobs:
  apply:
    if: github.head_ref == 'cursor/lobby-alarm-heartbeat'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - name: Apply lobby alarm heartbeat patch
        run: |
          set -euo pipefail
          if grep -Fq 'async alarmTick()' dasha-lobby-worker.mjs; then
            echo "patch already in worker"
            exit 0
          fi
          git apply patches/lobby-alarm-heartbeat.patch
          git rm -q patches/lobby-alarm-heartbeat.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dasha-lobby-worker.mjs dasha-compute-network.mjs
          git commit -m "Lobby alarm: always re-arm, record heartbeat, serve /compute/api/health/jobs"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
