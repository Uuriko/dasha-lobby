name: dl300-apply
on:
  push:
    branches: [instinct/dl300-usage-divergence]
    paths: ['.github/workflows/dl300-apply.yml']
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: instinct/dl300-usage-divergence
          fetch-depth: 2
      - name: Apply DL300 patch and remove this workflow
        run: |
          set -euo pipefail
          echo '' | base64 -d | gunzip > /tmp/dl300.patch
          echo "$(sha256sum /tmp/dl300.patch)"
          git apply --index /tmp/dl300.patch
          git rm -q .github/workflows/dl300-apply.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "Compute: settle on gateway-capped usage; divergent jobs to review (#300)" -m "Result and chunk paths share settleCompletedJob(): billed usage = min(provider, gateway) per field; provider completion above gateway*1.25+16 opens an idempotent audited review (compute:usage-review:<job>) before any earning, replay marker or signed settlement; 3 divergences in 24h hold the provider. accrueProviderEarn refuses jobs under open review. acceptUsageReview() settles once on capped usage. No historical rows rewritten. Claim RC-2026-09-23-DL300."
          git push origin "HEAD:instinct/dl300-usage-divergence"
