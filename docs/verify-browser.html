<!doctype html><meta charset=utf-8><title>Dasha chain verifier - full, in-browser</title>
<style>body{font:15px/1.6 system-ui;max-width:820px;margin:2em auto;padding:0 1em;background:#0b0e14;color:#dde}
code{background:#1c2230;padding:0 .4em;border-radius:4px}.ok{color:#7ee787}.bad{color:#ff7b72}h1{font-size:1.3em}#log{white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace;background:#12161f;padding:1em;border-radius:8px}</style>
<h1>Dasha receipt chain - full verification in your browser</h1>
<p>Every hash recomputed, every chain link checked, <b>every Ed25519 signature verified</b> against the published key. No server calls except reading the public chain + key. Nothing leaves your machine.</p>
<div id=log>verifying...</div>
<script type=module>
const B='https://www.getdasha.com';const L=m=>document.getElementById('log').textContent+=m+'\n';
document.getElementById('log').textContent='';
const J=async p=>(await fetch(B+p)).json();
const hex=b=>[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const spki=Uint8Array.from(atob((await J('/keys.json')).keys[0].spki_pem.replace(/-----\w+ PUBLIC KEY-----|\s/g,'')));
const key=await crypto.subtle.importKey('spki',spki,{name:'Ed25519'},false,['verify']);
const rs=(await J('/compute/api/chain')).receipts;
let prev='GENESIS',bad=0,t0=performance.now();
for(const r of rs){
  const body=JSON.stringify({job_id:r.job_id,engine:r.engine,tokens:r.tokens,cents:r.cents,at:r.at,prev_hash:r.prev_hash});
  const h=hex(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(body)));
  let ok=h===r.hash&&r.prev_hash===prev;
  if(ok) ok=await crypto.subtle.verify('Ed25519',key,b64(r.sig),new TextEncoder().encode(h));
  if(!ok){bad++;L('FAIL '+r.job_id);}
  prev=r.hash;
}
const ms=(performance.now()-t0).toFixed(0);
document.getElementById('log').innerHTML=(bad?`<span class=bad>${bad} FAILURES</span>`:`<span class=ok>OK: ${rs.length} receipts, 0 failures</span>`)+` in ${ms}ms<br>chain tip <code>${rs.at(-1).hash}</code><br>key id <code>${(await J('/keys.json')).keys[0].id}</code><br>checked ${new Date().toISOString()}`;
</script>
